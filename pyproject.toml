[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "everymind-insight"
version = "0.1.0"
description = "Local analytics for the EveryMind 988 training survey."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pyarrow>=17,<24",
    "numpy>=1.26,<3",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<3",
    "pandera[pandas]>=0.24,<1",
    "pydantic>=2.10,<3",
    "PyYAML>=6,<7",
    "rapidfuzz>=3.10,<4",
    "scipy>=1.15.3,<2",
    "statsmodels>=0.14,<1",
    "typer>=0.15,<1",
]

[project.optional-dependencies]
test = ["hypothesis>=6,<7", "pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
everymind_insight = "everymind_insight.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
everymind_insight = ["defaults/*.yaml", "defaults/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
